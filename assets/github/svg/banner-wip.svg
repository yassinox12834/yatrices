  <g font-family="Latin Modern Roman, Georgia, serif" font-weight="700">
    <text x="290" y="70" font-size="15" letter-spacing="3.4" fill="#0a9a97">WORK IN PROGRESS  ·  EVEN THE BITS MARKED DONE</text>
    <text x="288" y="122" font-size="46" fill="#0e2b31">Working isn't the same as finished.</text>
    <text x="290" y="156" font-size="19" font-weight="400" font-style="italic" fill="#4d6468">Vec does the job, but there are no C++ tests yet, no NumPy bridge, and no abs, sqrt or exp.</text>
